; ---------------------------------------------------------------------------
;  HideSheathedLeft -- Dark Souls III 1.15.0
;
;  This file is re-read every second (see IntervalSeconds below).  Edit it, save,
;  and the change takes effect while the game is running -- no restart needed.
;  A missing file means "all defaults".
; ---------------------------------------------------------------------------

[general]

; 1 = hide the model of the item held in the LEFT hand while that item is
;     sheathed (the normal case: you two-hand the RIGHT-hand weapon, so the
;     left weapon/shield would be displayed hanging on your back).
; 0 = off (vanilla behaviour).
HideLeftHang=1

; 1 = the mirror image: hide the model of the item held in the RIGHT hand while
;     that item is sheathed.  This is the state you reach by two-handing the
;     LEFT-hand weapon, where the right weapon/shield would otherwise hang on
;     your back.
; 0 = off (vanilla behaviour for the right hand).
HideRightHang=1

; 1 = also hide the spare blade(s) of a PAIRED weapon (models 1..3) while the
;     weapon is used one-handed.  Paired weapons normally show the second blade
;     on the body.  Applied to BOTH hands (the left-hand paired path is the exact
;     mirror of the right-hand one).
; 0 = off.
;
; (Earlier releases called this HidePairedOffhand and it only covered the RIGHT
;  hand.  That name still works when HideBothPaired is absent.)
HideBothPaired=1

; How often the patch is re-applied and this file is re-read, in seconds.
;
; The engine can rewrite these fields from its own regulation data (equipment
; change, area transition, param reload).  Until the next pass the vanilla value
; is live again, so this interval is also the longest a "sheathed item pops back
; into view for a moment" window can last -- keep it at 1 s.  Writing only
; happens when a value actually differs, so the steady-state cost is a few reads.
IntervalSeconds=1

; Which dummy poly the two hidden field groups are pointed at.
;
; Do NOT use an invalid poly (-1 / 65535): the engine then builds a degenerate
; (NaN) attachment matrix, which appears as black triangles and full-screen
; flicker.  The mod points the fields at a real dummy poly that sits 1000 m below
; the character, so the model is never drawn.
;
;   382 = the parking dummy.  The model patch in this package appends it to EVERY
;         character model (player and NPC), so both the player and an NPC that
;         enters the same stance get a valid dummy 1 km below -> the sheathed item
;         is simply not drawn anywhere: no black triangles, no clipping, no
;         scaling.  (The NPC difference from vanilla is only that its sheathed
;         left-hand item is hidden too.)
;   383 = second appended dummy, same spot (fallback).
;   -1  = old 1.0.0 behaviour (invalid poly).  Comparison only -- expect artifacts.
;
; Any other value selects that dummy poly id.  45 / 46 / 47 are the vanilla
; weapon-case positions, handy as a sanity check ("the item goes back on the hip
; instead of disappearing" = the write works and the id is being read).
HidePoly=382

; Which models of the RIGHT-hand weapon are hidden while it is used one-handed
; (paired weapons show an extra blade on the body).
;
;   1     = only the spare blade  -> safest; weapons whose models 2/3 are their
;           scabbard/sheath models (e.g. Onikiri & Ubadachi) keep the sheath
;   1,2,3 = also hide models 2/3  -> original 1.0.0 behaviour (default)
;   none  = do not touch the right-hand models at all
PairedFields=1,2,3


; ---------------------------------------------------------------------------
;  Diagnostic probe (only needed when investigating engine internals)
;
;  Probe=1 makes the mod write NOTHING.  Instead it puts PAGE_GUARD on the pages
;  that hold the WepAbsorpPosParam row data and logs every access to them:
;
;    PROBE #12 fault=0x... (table+0x...) RIP=0x... (exe+0x...) rcx=... rdx=...
;          r8=... r9=... ret=0x...,0x...,0x...
;
;  That identifies the engine code that reads a weapon's absorb/dummy fields --
;  the site a future player-only hook would have to patch.  Leave it at 0 for
;  normal use; while it is 1 the mod has no effect on the game.
; ---------------------------------------------------------------------------
Probe=0
ProbeAll=0
WorldChrManOffset=0x4768E78
ProbeLimit=2000
ProbeRearmMs=100

; ---------------------------------------------------------------------------
;  Table-scan policy
;
;  To find the parameter tables the mod walks its own address space, but it only
;  ever READS PAGES THAT ARE CURRENTLY RESIDENT and never falls back to a full
;  read.  Reading a page the OS has paged out faults it back into physical
;  memory; DS3 commits its resource pools during start-up (~8 GB) while only a
;  fraction of those pages is resident, so a full read made the whole pool
;  resident and the game appeared to use several GB more RAM than vanilla.  That
;  was the 1.0.1 behaviour, fixed in 1.0.2.  If the table is not resident yet the
;  engine has not loaded it yet, so the mod waits a second and retries (up to 600
;  attempts) instead of forcing pages in.
;
;  Every scan writes one line to HideSheathedLeft.log so the cost stays visible:
;    scan: 4 table(s); read 0 MB resident, left 7615 MB untouched of 7619 MB seen;
;          working set 1420 MB (peak 1520 MB)
;
;  ScanMapped=1 also considers MEM_MAPPED regions (resident pages only).  The
;  tables live in private memory, so this is a diagnostic, not something you
;  normally need.
;  Rescan=0 turns off the "tables went stale -> rescan" pass entirely (least CPU;
;  the effect may then not recover by itself after an engine-side table rebuild).
; ---------------------------------------------------------------------------
ScanMapped=0
Rescan=1

; 1 = write HideSheathedLeft.log next to this file.
Log=1


; ---------------------------------------------------------------------------
;  Mod loader shell
;
;  The game imports XINPUT1_3.dll by ordinal and Windows resolves imported DLLs
;  from the game folder first, so that file name is the earliest automatic way
;  into the process -- but only one file can own it.  This shell mirrors the
;  real DLL's full export table (forwarding everything to
;  %SystemRoot%\System32\xinput1_3.dll) and then loads other mod DLLs itself,
;  so any number of mods can share the slot.
; ---------------------------------------------------------------------------

[loader]

; 1 = also load this mod's core (HideSheathedLeft.dll).
; 0 = use this DLL purely as a mod loader; it then changes nothing by itself.
LoadCore=1

; Extra DLLs to load, separated by commas or semicolons.  Relative paths are
; resolved against the game folder; absolute paths also work.
;
; Example: a mod that documents itself as "rename this DLL to xinput1_3.dll and
; drop it in the game folder" only wanted the import slot as a way in -- rename
; it to anything else, list it here, and the forwarding duty is handled by this
; shell instead.
;
; Example: ExtraMods=dkp_loader.dll, SomeOtherMod.dll
ExtraMods=

; When to load them:
;   0      = immediately, while the game's imports are being resolved (earlier
;            than any launcher or injector could manage -- needed by mods that
;            patch or redirect something during start-up)
;   > 0    = wait this many milliseconds, then load from a background thread
;            (for mods that need the game to be further along)
ExtraModsDelayMs=0




